# Kinetic Platform Skills — Source of Truth
#
# This file is the canonical manifest of every skill in the library.
# CLAUDE.md, AGENTS.md, GEMINI.md, README.md, .cursor/rules/*.mdc, and
# .github/copilot-instructions.md are GENERATED from this file via
# `node scripts/build-indexes.mjs`. Do not edit those files directly.
#
# Schema:
#   sections: ordered list of section blocks
#     id: stable identifier
#     title: human-readable section heading
#     directory: where the skills in this section live
#     description: one-line section blurb (shown above the table in README)
#     skills: ordered list of skill entries
#       name: skill folder name (must match the SKILL.md frontmatter `name:`)
#       path: relative path from repo root to the SKILL.md
#       title: display name in tables
#       description: "Read when…" trigger text shown in the index tables
#       tags: optional list of tags for filtering (cursor rules, plugin selectors, etc.)
#         - "platform"     → included in .cursor/rules/kinetic-platform.mdc
#         - "front-end"    → included in .cursor/rules/kinetic-front-end.mdc
#         - "api"          → API reference skills
#         - "command"      → user-invocable slash commands

sections:
  - id: recipes
    title: "Recipes — Step-by-Step Guides"
    directory: skills/recipes
    description: "End-to-end guides for specific workflows or features"
    skills:
      - { name: create-submission-form, path: skills/recipes/create-submission-form/SKILL.md, title: "Create Submission Form",   description: "Create a form via API with fields, indexes, events, and handle submissions",                         tags: [platform] }
      - { name: add-approval-workflow,  path: skills/recipes/add-approval-workflow/SKILL.md,  title: "Add Approval Workflow",     description: "Build an approval/deferral workflow where a submission waits for someone's decision",              tags: [platform] }
      - { name: connect-external-system,path: skills/recipes/connect-external-system/SKILL.md,title: "Connect External System",   description: "Wire up a Connection/Operation to call an external REST API from workflows or forms",             tags: [platform] }
      - { name: build-paginated-list,   path: skills/recipes/build-paginated-list/SKILL.md,   title: "Build Paginated List",      description: "Show a filterable, paginated list of submissions in a React portal",                              tags: [front-end] }
      - { name: build-service-portal,   path: skills/recipes/build-service-portal/SKILL.md,   title: "Build Service Portal",      description: "Build a complete self-service portal (catalog, forms, request tracking, approvals)",              tags: [front-end] }

  - id: concepts
    title: "Concepts — Platform Fundamentals"
    directory: skills/concepts
    description: "Core platform concepts, APIs, and architecture topics"
    skills:
      - { name: api-basics,              path: skills/concepts/api-basics/SKILL.md,              title: "API Basics",              description: "Make any REST API call — endpoints, auth, query params, response shapes, submission CRUD. **Start here for API work.**",                                                                       tags: [platform] }
      - { name: form-engine,             path: skills/concepts/form-engine/SKILL.md,             title: "Form Engine",             description: "Understand form JSON schema, field types and their required properties, choices, content, buttons. **Start here for form structure.**",                                                       tags: [platform] }
      - { name: kapp-lifecycle,          path: skills/concepts/kapp-lifecycle/SKILL.md,          title: "Kapp Lifecycle",          description: "Kapp create/update/delete, formTypes registration, kapp indexes vs form indexes, categories, attributes, security assignment, PUT merge behavior",                                            tags: [platform] }
      - { name: form-events-expressions, path: skills/concepts/form-events-expressions/SKILL.md, title: "Form Events & Expressions",description: "Form events (load/submit/change/click), K() JavaScript API, expression syntax, bundle.config overrides, form-level integrations",                                                          tags: [platform] }
      - { name: kql-and-indexing,        path: skills/concepts/kql-and-indexing/SKILL.md,        title: "KQL & Indexing",          description: "Write search queries, create indexes, filter submissions. Read when you get KQL errors or need to search.",                                                                                    tags: [platform] }
      - { name: pagination,              path: skills/concepts/pagination/SKILL.md,              title: "Pagination",              description: "Page through results — pageToken, 1000-record cap workarounds, keyset pagination",                                                                                                            tags: [platform] }
      - { name: workflow-engine,         path: skills/concepts/workflow-engine/SKILL.md,         title: "Workflow Engine",         description: "Understand the execution model (trees, nodes, connectors, events, runs), deferrals/Queue Task pattern, run-status derivation, stuck-run repair",                                              tags: [platform] }
      - { name: workflow-xml,            path: skills/concepts/workflow-xml/SKILL.md,            title: "Workflow XML",            description: "Handler reference — handler definition IDs, parameters, loops, deferrals, `system_integration_v1` pattern, ERB context table, connectors, gotchas",                                            tags: [platform] }
      - { name: workflow-creation,       path: skills/concepts/workflow-creation/SKILL.md,       title: "Workflow Creation",       description: "Create/manage workflows — Core API two-step creation, kapp vs form, filters, supported events, tree title format, treeJson upload, sources",                                                  tags: [platform] }
      - { name: task-api-reference,      path: skills/concepts/task-api-reference/SKILL.md,      title: "Task API Reference",      description: "Call the Task API v2 directly — trees/runs/handlers/sources endpoints, triggers & errors APIs, run/tree/task response shapes, meta resources",                                              tags: [platform] }
      - { name: integrations,            path: skills/concepts/integrations/SKILL.md,            title: "Integrations",            description: "Set up Connections/Operations (preferred), choose between integration mechanisms (Connections vs Bridges vs Handlers vs File Resources), and learn the Integrator REST schema, import/management gotchas, and SMTP/handler-property quirks", tags: [platform] }
      - { name: file-resources,          path: skills/concepts/file-resources/SKILL.md,          title: "File Resources",          description: "Stream files from external systems (S3, SharePoint, CMS, legacy DMS) into the Kinetic UI — distinct from the built-in attachment form-field type",                                            tags: [platform] }
      - { name: loghub-api,              path: skills/concepts/loghub-api/SKILL.md,              title: "LogHub API",              description: "Read real-time platform logs — endpoint, Bearer-JWT auth signed with oauthSigningKey, NDJSON shape, correlationId joining",                                                                  tags: [platform] }
      - { name: decision-frameworks,     path: skills/concepts/decision-frameworks/SKILL.md,     title: "Decision Frameworks",     description: "Choose between approaches — which integration type, where to store data, workflow vs real-time",                                                                                              tags: [platform] }
      - { name: architectural-patterns,  path: skills/concepts/architectural-patterns/SKILL.md,  title: "Architectural Patterns",  description: "Implement approvals, deferrals, fulfillment queues, SLA tracking, external system sync, scheduled jobs, privileged actions",                                                                                                     tags: [platform] }
      - { name: robots,                  path: skills/concepts/robots/SKILL.md,                  title: "Robots",                  description: "Scheduled automation — robot-definitions/executions/next-execution forms, the execution routine, robot tree pattern, creating/scheduling a robot, gotchas",                                  tags: [platform] }
      - { name: webapis-and-webhooks,    path: skills/concepts/webapis-and-webhooks/SKILL.md,    title: "WebAPIs & Webhooks",      description: "Create custom REST endpoints (WebAPIs) or event-driven triggers (webhooks)",                                                                                                                  tags: [platform] }
      - { name: users-and-teams,         path: skills/concepts/users-and-teams/SKILL.md,         title: "Users & Teams",           description: "Manage users/teams — CRUD, memberships, management patterns",                                                                                                                                tags: [platform] }
      - { name: security-policies,       path: skills/concepts/security-policies/SKILL.md,       title: "Security Policies",       description: "KSL security expressions, policy definitions, binding functions, Core (JS) vs Task (Ruby) policy layers, space-admin bypass, access control",                                                tags: [platform] }
      - { name: attribute-definitions,   path: skills/concepts/attribute-definitions/SKILL.md,   title: "Attribute Definitions",   description: "Define custom metadata on space/kapp/form/user/userProfile/team/category — per-scope endpoints, allowsMultiple semantics, resolution hierarchy",                                              tags: [platform] }
      - { name: submission-activities,   path: skills/concepts/submission-activities/SKILL.md,   title: "Submission Activities",   description: "Per-submission audit trail / timeline — /submissions/{id}/activities CRUD, include=activities,activities.details, workflow-generated activity types",                                       tags: [platform] }
      - { name: models,                  path: skills/concepts/models/SKILL.md,                  title: "Models (Data Views)",     description: "Query external data from forms via bridge models and bridged resources",                                                                                                                     tags: [platform] }
      - { name: ruby-sdk,                path: skills/concepts/ruby-sdk/SKILL.md,                title: "Ruby SDK",                description: "Script admin operations, bulk imports, migrations using the `kinetic_sdk` gem",                                                                                                              tags: [platform] }
      - { name: template-provisioning,   path: skills/concepts/template-provisioning/SKILL.md,   title: "Template Provisioning",   description: "Export/import entire spaces, write install.rb provisioning scripts",                                                                                                                        tags: [platform] }

